<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>hola</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #07070c;
      overflow: hidden;
      font-family: 'Courier New', Courier, monospace;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .glow-text {
      text-shadow: 0 0 8px rgba(255, 117, 143, 0.75), 0 0 18px rgba(255, 117, 143, 0.35);
    }
  </style>
</head>
<body class="relative bg-[#07070c] text-white">

  <!-- Lienzo principal para el arte ASCII -->
  <canvas id="asciiCanvas"></canvas>

  <!-- Controles discretos en la esquina superior -->
  <div class="fixed top-4 right-4 z-10 flex items-center gap-2">
    <button id="windBtn" class="px-3 py-1.5 rounded-full bg-white/5 hover:bg-white/15 active:scale-95 border border-white/10 text-xs text-pink-200/80 backdrop-blur-sm transition cursor-pointer">
      ~ Brisa
    </button>
    <button id="replayBtn" class="px-3 py-1.5 rounded-full bg-white/5 hover:bg-white/15 active:scale-95 border border-white/10 text-xs text-pink-200/80 backdrop-blur-sm transition cursor-pointer">
      ↻ Repetir
    </button>
  </div>

  <!-- Indicador sutil inferior -->
  <div class="fixed bottom-3 left-0 right-0 text-center pointer-events-none">
    <span class="text-[11px] tracking-widest text-white/30">toca la pantalla para enviar una brisa</span>
  </div>

  <script>
    /**
     * Animación generativa de ramo de flores silvestres en arte ASCII.
     * Adaptable a pantallas verticales (móvil) y horizontales (PC).
     */
    const canvas = document.getElementById('asciiCanvas');
    const ctx = canvas.getContext('2d');
    const replayBtn = document.getElementById('replayBtn');
    const windBtn = document.getElementById('windBtn');

    let width = 0;
    let height = 0;
    let cols = 0;
    let rows = 0;
    let charW = 8;
    let charH = 13;
    let fontSize = 12;

    // Estado de la animación e interacción
    let startTime = performance.now();
    let windGust = 0;
    let windTarget = 0;
    let pointerX = 0;
    let pointerActive = false;

    // Mensaje estilo máquina de escribir debajo del ramo con corazón
    const dedicationText = "solo me ha dado tiempo a esto, te quierooooooo ♥";

    // Definición de rosas (espirales carmesí/rubí) y peonías (voluminosas rosa pastel/magenta/coral)
    // Punto medio: ramo unido y armonioso con aire suficiente para distinguir cada flor
    const bouquetFlowers = [
      // Peonía grande superior izquierda (rosa pastel suave)
      { type: 'peony', rx: -0.14, ry: -0.34, core: '#ff4d8d', inner: '#ff85a1', mid: '#ffb3c6', outer: '#ffe5ec', glow: 'rgba(255,143,163,0.45)', radius: 5.1, speed: 0.90, phase: 1.2, curve: -0.8 },
      // Rosa central alta (carmesí profundo y escarlata)
      { type: 'rose',  rx:  0.00, ry: -0.43, core: '#590d22', inner: '#a4133c', mid: '#d90429', outer: '#ff4d6d', glow: 'rgba(217,4,41,0.55)',    radius: 4.4, speed: 1.02, phase: 2.3, curve:  0.1 },
      // Peonía grande superior derecha (magenta y coral)
      { type: 'peony', rx:  0.15, ry: -0.33, core: '#c9184a', inner: '#ff477e', mid: '#ff7096', outer: '#ffccd5', glow: 'rgba(255,71,126,0.45)',  radius: 5.0, speed: 0.95, phase: 0.5, curve:  0.9 },
      // Rosa lateral izquierda (rojo rubí intenso)
      { type: 'rose',  rx: -0.22, ry: -0.20, core: '#641220', inner: '#b21e35', mid: '#e01e37', outer: '#ff758f', glow: 'rgba(224,30,55,0.50)',   radius: 4.1, speed: 1.15, phase: 3.1, curve: -1.1 },
      // Peonía central frondosa (coral y rubor pastel)
      { type: 'peony', rx:  0.00, ry: -0.22, core: '#d81159', inner: '#ff5d8f', mid: '#ff9ebb', outer: '#fff0f3', glow: 'rgba(255,158,187,0.50)', radius: 5.2, speed: 0.85, phase: 1.8, curve: -0.2 },
      // Rosa lateral derecha (escarlata vibrante)
      { type: 'rose',  rx:  0.23, ry: -0.19, core: '#590d22', inner: '#9b0000', mid: '#d00000', outer: '#ff5c8a', glow: 'rgba(208,0,0,0.50)',     radius: 4.1, speed: 1.18, phase: 2.7, curve:  1.1 },
      // Rosa baja izquierda (carmesí)
      { type: 'rose',  rx: -0.11, ry: -0.11, core: '#4a0404', inner: '#800f2f', mid: '#c9184a', outer: '#ff4d6d', glow: 'rgba(201,24,74,0.50)',   radius: 3.8, speed: 1.10, phase: 0.9, curve: -0.6 },
      // Peonía baja derecha (rosa rubor suave)
      { type: 'peony', rx:  0.12, ry: -0.11, core: '#b5179e', inner: '#f72585', mid: '#ff8fab', outer: '#ffe5ec', glow: 'rgba(247,37,133,0.45)',  radius: 4.3, speed: 1.05, phase: 3.8, curve:  0.7 }
    ];

    // Pequeños brotes laterales / hojas silvestres ajustados al nuevo ancho
    const wildSprigs = [
      { rx: -0.27, ry: -0.09, color: '#52b788', phase: 0.6 },
      { rx:  0.28, ry: -0.08, color: '#40916c', phase: 2.1 },
      { rx: -0.09, ry: -0.30, color: '#74c69d', phase: 1.3 },
      { rx:  0.10, ry: -0.31, color: '#74c69d', phase: 3.4 }
    ];

    // Estrellas y destellos ASCII en el fondo
    const stars = Array.from({ length: 55 }, () => ({
      x: Math.random(),
      y: Math.random() * 0.85,
      type: Math.random(),
      phase: Math.random() * Math.PI * 2,
      speed: 0.8 + Math.random() * 1.5
    }));

    // Partículas flotantes (polen luminoso)
    const pollen = Array.from({ length: 24 }, () => ({
      x: 0.28 + Math.random() * 0.44,
      y: 0.25 + Math.random() * 0.55,
      vx: (Math.random() - 0.5) * 0.02,
      vy: -0.015 - Math.random() * 0.02,
      phase: Math.random() * Math.PI * 2
    }));

    const roseChars = ['@', 'G', 'e', 'o', 'c', '('];
    const peonyChars = ['#', 'W', 'M', '%', '*', 'o', '~'];

    /**
     * Ajusta la cuadrícula ASCII según el tamaño del dispositivo
     */
    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;

      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      // Escalar tipografía ligeramente para móviles muy estrechos
      const isMobile = width < 600;
      fontSize = isMobile ? 11 : 13;
      charW = isMobile ? 7.2 : 8.5;
      charH = isMobile ? 12 : 14;

      cols = Math.floor(width / charW);
      rows = Math.floor(height / charH);
    }

    window.addEventListener('resize', resize);
    resize();

    /**
     * Dibuja un carácter individual en la cuadrícula ASCII con brillo opcional
     */
    function drawChar(ch, col, row, color, glowColor = null) {
      if (col < 0 || col >= cols || row < 0 || row >= rows) return;
      if (glowColor) {
        ctx.shadowColor = glowColor;
        ctx.shadowBlur = 7;
      } else {
        ctx.shadowBlur = 0;
      }
      ctx.fillStyle = color;
      ctx.fillText(ch, col * charW, row * charH);
    }

    /**
     * Dibuja estrellas y destellos parpadeantes en el fondo
     */
    function drawBackgroundStars(t) {
      stars.forEach(s => {
        const alpha = 0.15 + 0.75 * Math.abs(Math.sin(t * s.speed + s.phase));
        const ch = s.type > 0.7 ? '+' : s.type > 0.35 ? '*' : '·';
        drawChar(ch, Math.floor(s.x * cols), Math.floor(s.y * rows), `rgba(220, 225, 255, ${alpha.toFixed(2)})`);
      });
    }

    /**
     * Dibuja una rosa ASCII con capas en espiral o una peonía frondosa con pétalos rizados
     */
    function drawFlower(cx, cy, f, t, bloomProgress) {
      if (bloomProgress <= 0) return;
      const r = f.radius * bloomProgress;
      const aspect = 1.42; // Compensa la proporción alto/ancho de fuente monoespaciada

      const maxDy = Math.ceil(r + 1.5);
      const maxDx = Math.ceil((r + 1.5) * aspect);

      for (let dy = -maxDy; dy <= maxDy; dy++) {
        for (let dx = -maxDx; dx <= maxDx; dx++) {
          const nx = dx / aspect;
          const dist = Math.sqrt(nx * nx + dy * dy);
          const angle = Math.atan2(dy, nx);

          if (f.type === 'rose') {
            // Geometría de rosa: capas en espiral envolventes con bordes definidos
            const spiral = Math.sin(angle * 3 + dist * 2.1 - t * 0.6 + f.phase) * 0.45;
            const cupEdge = Math.cos(angle * 2 + f.phase) * 0.35;
            const effectiveR = r + cupEdge * bloomProgress;

            if (dist <= effectiveR) {
              const normDist = dist / Math.max(0.1, effectiveR);
              let color = f.outer;
              if (normDist < 0.24) color = f.core;
              else if (normDist < 0.52) color = f.inner;
              else if (normDist < 0.80) color = f.mid;

              // Selección de carácter siguiendo el giro de la espiral
              const spiralIdx = Math.abs(Math.floor((normDist * 4.5 + spiral) * roseChars.length)) % roseChars.length;
              const ch = normDist < 0.20 ? '@' : roseChars[spiralIdx];
              drawChar(ch, Math.round(cx + dx), Math.round(cy + dy), color, f.glow);
            }
          } else {
            // Geometría de peonía: flor muy llena, rizada y voluminosa con múltiples ondas
            const ruffleOuter = Math.sin(angle * 7 + t * 0.8 + f.phase) * 0.75 * bloomProgress;
            const ruffleInner = Math.cos(angle * 11 - t * 0.5 + f.phase) * 0.35 * bloomProgress;
            const effectiveR = r + ruffleOuter + ruffleInner;

            if (dist <= effectiveR) {
              const normDist = dist / Math.max(0.1, effectiveR);
              let color = f.outer;
              if (normDist < 0.22) color = f.core;
              else if (normDist < 0.48) color = f.inner;
              else if (normDist < 0.76) color = f.mid;

              // Textura densa en el interior y pétalos vaporosos (~) en el borde
              let ch;
              if (normDist > 0.86) {
                ch = (Math.floor(angle * 4) % 2 === 0) ? '~' : 'o';
              } else {
                const waveIdx = Math.abs(Math.floor((normDist * 5 + Math.sin(angle * 6)) * peonyChars.length)) % peonyChars.length;
                ch = peonyChars[waveIdx];
              }
              drawChar(ch, Math.round(cx + dx), Math.round(cy + dy), color, f.glow);
            }
          }
        }
      }
    }

    /**
     * Dibuja el lazo ASCII en la base del ramo
     */
    function drawRibbon(baseX, baseY, grow) {
      if (grow < 0.15) return;
      const ribbonColor = '#ff758f';
      const knotColor = '#ff4d6d';

      // Nudo central
      drawChar('<', baseX - 2, baseY - 2, ribbonColor, knotColor);
      drawChar('=', baseX - 1, baseY - 2, ribbonColor, knotColor);
      drawChar('#', baseX,     baseY - 2, knotColor, knotColor);
      drawChar('=', baseX + 1, baseY - 2, ribbonColor, knotColor);
      drawChar('>', baseX + 2, baseY - 2, ribbonColor, knotColor);

      // Cintas colgantes
      drawChar('/',  baseX - 1, baseY - 1, ribbonColor);
      drawChar('\\', baseX + 1, baseY - 1, ribbonColor);
      drawChar('/',  baseX - 2, baseY,     ribbonColor);
      drawChar('\\', baseX + 2, baseY,     ribbonColor);
    }

    /**
     * Bucle principal de renderizado
     */
    function render(now) {
      const t = (now - startTime) / 1000;

      // Suavizado de ráfaga de viento
      windGust += (windTarget - windGust) * 0.06;
      windTarget *= 0.96;

      // Progreso de crecimiento inicial (0 a 1 en 2.4 segundos)
      const rawGrow = Math.min(1, t / 2.4);
      const grow = 1 - Math.pow(1 - rawGrow, 3); // Ease-out cúbico

      // Limpiar fondo
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#07070c';
      ctx.fillRect(0, 0, width, height);
      ctx.font = `bold ${fontSize}px "Courier New", Courier, monospace`;

      // 1. Estrellas
      drawBackgroundStars(t);

      const baseX = Math.floor(cols / 2);
      const baseY = Math.floor(rows * 0.86);
      const scale = Math.min(cols * 0.95, rows * 1.15);

      // 2. Brotes verdes laterales
      wildSprigs.forEach(s => {
        const sway = Math.sin(t * 1.3 + s.phase) * 1.5 + windGust * 3.5;
        const tx = baseX + (s.rx * scale + sway) * grow;
        const ty = baseY + (s.ry * scale) * grow;
        const steps = 16;
        for (let i = 0; i <= steps; i++) {
          const p = i / steps;
          const sx = baseX + (tx - baseX) * p;
          const sy = baseY + (ty - baseY) * p;
          drawChar(p > 0.7 ? '*' : '.', Math.round(sx), Math.round(sy), s.color);
        }
      });

      // 3. Tallos principales primero (para que nunca tapen la cara de una flor cercana)
      const flowerPositions = bouquetFlowers.map(f => {
        const pointerOffset = pointerActive ? ((pointerX / width) - 0.5) * 4.5 : 0;
        const sway = (Math.sin(t * f.speed + f.phase) * 1.9 + windGust * 5.0 + pointerOffset) * grow;

        const targetX = baseX + f.rx * scale + sway;
        const targetY = baseY + f.ry * scale;

        const curX = baseX + (targetX - baseX) * grow;
        const curY = baseY + (targetY - baseY) * grow;

        // Tallo curvo compuesto por caracteres ASCII
        const steps = 38;
        for (let i = 0; i <= steps; i++) {
          const p = i / steps;
          const arch = Math.sin(p * Math.PI) * (f.curve * 2.4);
          const sx = baseX + (curX - baseX) * p + arch;
          const sy = baseY + (curY - baseY) * p;

          const dx = curX - baseX;
          let stemChar = '|';
          if (dx > 2.5) stemChar = '/';
          else if (dx < -2.5) stemChar = '\\';

          const stemColor = p > 0.65 ? '#52b788' : p > 0.3 ? '#40916c' : '#2d6a4f';
          drawChar(stemChar, Math.round(sx), Math.round(sy), stemColor);

          // Hojitas a mitad de tallo
          if (i === 18 && grow > 0.5) {
            drawChar('~', Math.round(sx) - 1, Math.round(sy), '#74c69d');
            drawChar('~', Math.round(sx) + 1, Math.round(sy), '#74c69d');
          }
        }

        return { f, curX, curY };
      });

      // 3b. Cabezas de flores dibujadas encima de todos los tallos con fondo limpio
      const bloom = Math.max(0, Math.min(1, (grow - 0.32) / 0.68));
      flowerPositions.forEach(({ f, curX, curY }) => {
        // Limpiar un pequeño halo oscuro detrás de cada flor para que los tallos de detrás no ensucien los pétalos
        if (bloom > 0.2) {
          const clearR = f.radius * bloom * 0.90;
          const aspect = 1.42;
          for (let dy = -Math.ceil(clearR); dy <= Math.ceil(clearR); dy++) {
            for (let dx = -Math.ceil(clearR * aspect); dx <= Math.ceil(clearR * aspect); dx++) {
              if ((dx / aspect) ** 2 + dy ** 2 <= clearR ** 2) {
                const col = Math.round(curX + dx);
                const row = Math.round(curY + dy);
                if (col >= 0 && col < cols && row >= 0 && row < rows) {
                  ctx.shadowBlur = 0;
                  ctx.fillStyle = '#07070c';
                  ctx.fillText('█', col * charW, row * charH);
                }
              }
            }
          }
        }
        drawFlower(curX, curY, f, t, bloom);
      });

      // 4. Lazo en la base del ramo
      drawRibbon(baseX, baseY, grow);

      // 5. Polen flotante luminoso
      if (grow > 0.6) {
        pollen.forEach(p => {
          p.y += p.vy * 0.016;
          p.x += (p.vx + windGust * 0.008) * 0.016;
          if (p.y < 0.15) {
            p.y = 0.78;
            p.x = 0.28 + Math.random() * 0.44;
          }
          const alpha = 0.35 + 0.55 * Math.sin(t * 2 + p.phase);
          drawChar('·', Math.floor(p.x * cols), Math.floor(p.y * rows), `rgba(255, 225, 130, ${alpha.toFixed(2)})`);
        });
      }

      // 6. Texto deductorio tipo máquina de escribir debajo del ramo
      if (t > 1.4) {
        const visibleChars = Math.min(dedicationText.length, Math.floor((t - 1.4) * 16));
        const currentStr = dedicationText.slice(0, visibleChars);
        const textRow = Math.min(rows - 3, baseY + 3);
        const maxLineChars = Math.max(20, cols - 4);

        if (dedicationText.length <= maxLineChars) {
          const startCol = Math.max(1, Math.floor((cols - dedicationText.length) / 2));
          for (let i = 0; i < currentStr.length; i++) {
            const isHeart = currentStr[i] === '♥';
            drawChar(
              currentStr[i],
              startCol + i,
              textRow,
              isHeart ? '#ff2a5f' : '#ff8fa3',
              isHeart ? 'rgba(255, 42, 95, 0.95)' : 'rgba(255, 117, 143, 0.7)'
            );
          }
          if (Math.floor(t * 2.5) % 2 === 0) {
            drawChar('_', startCol + currentStr.length, textRow, '#ffb3c1');
          }
        } else {
          // Dividir en dos líneas si el móvil es muy estrecho para que no se corte
          const splitIdx = dedicationText.lastIndexOf(' ', Math.floor(dedicationText.length * 0.65));
          const line1Full = dedicationText.slice(0, splitIdx);
          const line2Full = dedicationText.slice(splitIdx + 1);

          const line1 = currentStr.slice(0, Math.min(currentStr.length, line1Full.length));
          const line2 = currentStr.length > line1Full.length + 1 ? currentStr.slice(line1Full.length + 1) : '';

          const startCol1 = Math.max(1, Math.floor((cols - line1Full.length) / 2));
          const startCol2 = Math.max(1, Math.floor((cols - line2Full.length) / 2));

          for (let i = 0; i < line1.length; i++) {
            drawChar(line1[i], startCol1 + i, textRow - 1, '#ff8fa3', 'rgba(255, 117, 143, 0.7)');
          }
          for (let i = 0; i < line2.length; i++) {
            const isHeart = line2[i] === '♥';
            drawChar(
              line2[i],
              startCol2 + i,
              textRow + 1,
              isHeart ? '#ff2a5f' : '#ff8fa3',
              isHeart ? 'rgba(255, 42, 95, 0.95)' : 'rgba(255, 117, 143, 0.7)'
            );
          }
          if (Math.floor(t * 2.5) % 2 === 0) {
            if (currentStr.length <= line1Full.length) {
              drawChar('_', startCol1 + line1.length, textRow - 1, '#ffb3c1');
            } else {
              drawChar('_', startCol2 + line2.length, textRow + 1, '#ffb3c1');
            }
          }
        }
      }

      requestAnimationFrame(render);
    }

    // Interacciones táctiles y de ratón
    function triggerWind(dir = 1) {
      windTarget = dir * (1.2 + Math.random() * 0.8);
    }

    canvas.addEventListener('click', (e) => {
      const dir = e.clientX < width / 2 ? 1 : -1;
      triggerWind(dir);
    });

    canvas.addEventListener('mousemove', (e) => {
      pointerX = e.clientX;
      pointerActive = true;
    });

    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length > 0) {
        const dir = e.touches[0].clientX < width / 2 ? 1 : -1;
        triggerWind(dir);
      }
    }, { passive: true });

    windBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      triggerWind(Math.random() > 0.5 ? 1 : -1);
    });

    replayBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      startTime = performance.now();
      windGust = 0;
      windTarget = 0;
    });

    // Arrancar animación
    window.onload = () => {
      requestAnimationFrame(render);
    };
  </script>
</body>
</html>
